# Run with: docker compose -f compose.yaml -f compose.production.yaml up --build -d
# PUBLIC_SITE_HOST is a bare DNS name (for example, www.example.org), not a URL.
services:
  api:
    environment:
      PUBLIC_APP_ORIGIN: https://${PUBLIC_SITE_HOST:?Set PUBLIC_SITE_HOST in .env}

  web:
    build:
      args:
        PUBLIC_SITE_ORIGIN: https://${PUBLIC_SITE_HOST:?Set PUBLIC_SITE_HOST in .env}
        PUBLIC_SITE_INDEXABLE: ${PUBLIC_SITE_INDEXABLE:-false}
    environment:
      PUBLIC_SITE_ORIGIN: https://${PUBLIC_SITE_HOST:?Set PUBLIC_SITE_HOST in .env}
      PUBLIC_SITE_INDEXABLE: ${PUBLIC_SITE_INDEXABLE:-false}
    ports: !reset []

  proxy:
    image: caddy:2-alpine
    environment:
      PUBLIC_SITE_HOST: ${PUBLIC_SITE_HOST:?Set PUBLIC_SITE_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    networks: [private]

volumes:
  caddy_data:
  caddy_config:
